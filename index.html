<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Button</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top, #203a43, transparent 45%),
        linear-gradient(135deg, #050505, #111827, #050505);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Container */
.container {
    text-align: center;
}

/* Judul */
h1 {
    color: white;
    margin-bottom: 30px;
    letter-spacing: 3px;
    animation: titleIn 1s ease forwards;
}

/* Button */
.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 17px 45px;
    min-width: 190px;

    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;

    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50px;

    background: rgba(255,255,255,.08);
    backdrop-filter: blur(10px);

    box-shadow:
        0 0 15px rgba(0,255,255,.2),
        inset 0 0 15px rgba(255,255,255,.05);

    overflow: hidden;

    /* Animasi ketika pertama muncul */
    opacity: 0;
    transform: translateY(60px) scale(.7);

    animation:
        buttonIn 1s cubic-bezier(.17,.89,.32,1.28) .5s forwards,
        floating 3s ease-in-out 1.6s infinite;
}

/* Cahaya bergerak */
.btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
    );

    transform: skewX(-25deg);
    transition: .6s;
}

/* Hover */
.btn:hover {
    transform: scale(1.08);
    border-color: #00ffff;

    box-shadow:
        0 0 15px #00ffff,
        0 0 35px rgba(0,255,255,.5),
        inset 0 0 15px rgba(0,255,255,.2);
}

.btn:hover::before {
    left: 130%;
}

/* Klik */
.btn:active {
    transform: scale(.95);
}

/* Icon */
.icon {
    margin-left: 12px;
    font-size: 20px;
    transition: .4s;
}

.btn:hover .icon {
    transform: translateX(7px);
}

/* Animasi masuk */
@keyframes buttonIn {
    0% {
        opacity: 0;
        transform: translateY(60px) scale(.7) rotate(-5deg);
    }

    70% {
        opacity: 1;
        transform: translateY(-10px) scale(1.05) rotate(2deg);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
    }
}

/* Animasi melayang */
@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* Judul masuk */
@keyframes titleIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Background particle */
.dot {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #00ffff;
    border-radius: 50%;
    opacity: .5;
    animation: move 5s linear infinite;
}

.dot:nth-child(1) {
    left: 10%;
    animation-delay: 0s;
}

.dot:nth-child(2) {
    left: 30%;
    animation-delay: 1s;
}

.dot:nth-child(3) {
    left: 70%;
    animation-delay: 2s;
}

.dot:nth-child(4) {
    left: 90%;
    animation-delay: 3s;
}

@keyframes move {
    from {
        top: 110%;
        transform: scale(.5);
    }

    to {
        top: -10%;
        transform: scale(1.5);
    }
}
</style>
</head>

<body>

<!-- Background -->
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>

<div class="container">

    <h1>WELCOME</h1>

    <!-- BUTTON LINK -->
    <a href="https://vt.tiktok.com/ZSV5rFDVw/" class="btn">
        pencet aku
        <span class="icon">➜</span>
    </a>

</div>

</body>
</html>
